<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SC2 Replay Viewer</title>
<link rel="stylesheet" href="viewer.css?v=5">
</head>
<body>

<div id="matchTitle">No match loaded</div>

<div id="loadBar">
  <label for="fileInput">Frame file (.frames.jsonl.gz): </label>
  <input type="file" id="fileInput" accept=".gz">
  <span id="loadStatus"></span>
  <label for="logFileInput">Bot log (stderr.log): </label>
  <input type="file" id="logFileInput" accept=".log,.txt">
  <span id="logStatus"></span>
</div>

<div id="main">
  <div id="mapPane">
    <canvas id="mapCanvas"></canvas>
  </div>
  <div id="sidePane">
    <div id="hud"></div>
    <hr>
    <div id="botAnalysis"><em>Load a bot log to see Game Analyzer / Build Detector</em></div>
    <hr>
    <div id="unitDetail"><em>Click a unit to inspect it</em></div>
  </div>
</div>

<div id="controls">
  <button id="stepBackBtn">&#9664;</button>
  <button id="playBtn">Play</button>
  <button id="stepFwdBtn">&#9654;</button>
  <input type="range" id="scrubBar" min="0" value="0" step="1">
  <span id="frameLabel"></span>
</div>

<div id="logPanel">
  <div id="logResizeHandle"></div>
  <div id="logTableWrap">
    <table id="logTable">
      <thead>
        <tr><th>Loop</th><th>Clock</th><th>Level</th><th>Logger</th><th>Message</th></tr>
      </thead>
      <tbody id="logTableBody"></tbody>
    </table>
  </div>
</div>

<!-- ?v= is a manual cache-buster: bump it whenever viewer.js/viewer.css changes.
     Without it, a browser tab left open (or one that cached the response) can keep
     running stale JS after a deploy with no visible sign anything's wrong — this is
     what happened after the match-label fix landed on test_lab but a browser had
     already cached the previous viewer.js. -->
<script src="data/ability_names.js"></script>
<script src="data/unit_type_names.js"></script>
<script src="viewer.js?v=6"></script>
</body>
</html>
